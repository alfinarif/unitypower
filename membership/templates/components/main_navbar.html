{% load i18n %}
{% load static %}

<div class="header-container fixed-top">
    
        <header class="header navbar navbar-expand-sm expand-header">
            <a href="javascript:void(0);" class="sidebarCollapse" data-placement="bottom"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-menu"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></a>

            <ul class="navbar-item flex-row ml-auto">

                <li class="nav-item align-self-center search-animated">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search toggle-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <form class="form-inline search-full form-inline search" role="search">
                        <div class="search-bar">
                            <input type="text" class="form-control search-form-control  ml-lg-auto" placeholder="Search...">
                        </div>
                    </form>
                </li>




                <li class="mr-3 nav-item dropdown notification-dropdown">
                    <form class="" id="languageForm" method="post" action="{% url 'set_language' %}">
                        {% csrf_token %}
                        <select class="selectpicker form-control" name="language" id="language" onchange="changeLanguage(this.value)">
                            {% for lang_code, lang_name in LANGUAGES %}
                                {% if lang_code == LANGUAGE_CODE %}
                                    <option value="{{lang_code}}" selected>{{lang_name}}</option>
                                {% else %}
                                    <option value="{{lang_code}}">{{lang_name}}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </form>
                    <script>
                        function changeLanguage(languageCode) {
                            const form = document.getElementById('languageForm');
                            form.elements.language.value = languageCode;
                            form.submit();
                        }
                    </script>
                </li>
                


            </ul>
        </header>

        
    </div>
