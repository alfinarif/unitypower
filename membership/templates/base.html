<script type="module">
    // 1. FIXED: Imported getMessaging and getToken from the correct messaging library
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";
;

    // 2. Your Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBM4LBoYge8cYXsApqlENCcmlQPgfTXDus",
        authDomain: "unitypoweradmin.firebaseapp.com",
        projectId: "unitypoweradmin",
        storageBucket: "unitypoweradmin.firebasestorage.app",
        messagingSenderId: "971726673464",
        appId: "1:971726673464:web:af98af9c0b85d04b6ef8cd",
        measurementId: "G-FG4MGHTBJ9"
    };

    // FIXED: Initialized messaging instead of analytics
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const messaging = getMessaging(app);


    // 3. Register the local Service Worker explicitly
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then((registration) => {
            console.log('Service Worker registered with scope:', registration.scope);
            
            // FIXED: Automatically trigger token generation right after SW finishes registering
            autoRequestToken();
        }).catch((err) => {
            console.error('Service Worker registration failed:', err);
        });
    }

    // 4. Automatically request permission and fetch token
    function autoRequestToken() {
        Notification.requestPermission().then((permission) => {
            if (permission === 'granted') {
                console.log('Notification permission granted. Fetching token...');
                
                getToken(messaging, { vapidKey: 'BFlTAkDwdI1Eb7VkO4XrYjyJ1bBKca8kCprMI6sQz7_p-A2eEKeCClJlmw-ZdhnySA-Ro8bRaZ7iugs3MPglVCY' })
                .then((currentToken) => {
                    if (currentToken) {
                        console.log("Auto-generated Token: ", currentToken);
                        sendTokenToBackend(currentToken);
                    } else {
                        console.log('No registration token available.');
                    }
                }).catch((err) => {
                    console.error('An error occurred while retrieving token: ', err);
                });
            } else {
                console.warn('Notification permission was denied or dismissed.');
            }
        });
    }


    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                // Check if this cookie string begins with the name we want
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function sendTokenToBackend(token) {
        const csrfToken = getCookie('csrftoken');

        // Make sure the path is exactly '/api/devices/' with slashes at both ends
        fetch('/api/devices/', { 
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken 
            },
            body: JSON.stringify({
                registration_id: token,
                type: 'web'
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => console.log('Token saved successfully:', data))
        .catch(error => console.error('Error saving token:', error));
    }

    console.log('FCM File called successfully.....!')
</script>
