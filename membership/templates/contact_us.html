{% extends "base.html" %}
{% load i18n %}



{% block content %}
    <!--  BEGIN MAIN CONTAINER  -->
    <div class="main-container sidebar-closed sbar-open" id="container">

        <div class="overlay"></div>
        <div class="cs-overlay"></div>
        <div class="search-overlay"></div>

        {% include "components/sidebar.html" %}

        <!--  Showing toast messages  -->
        {% include "components/toast_message.html" %}
        <!--  Showing toast messages end -->


        <!--  BEGIN CONTENT AREA  -->
        <div id="content" class="main-content">
            <div class="container">
                <div class="container">
                    

                    <br><br>
                    <div class="row">
                        <div id="custom_styles" class="col-lg-12  col-md-12">
                            <div class="statbox widget box box-shadow">
                                <div class="widget-header">
                                    <div class="row  mt-3">
                                        <div class="col-xl-12 col-md-12 col-sm-12 col-12 text-center">
                                            <h3><strong>CONTACT WITH MANAGEMENT</strong></h3>
                                        </div>                 
                                    </div>
                                </div>
                                
                                <div class="widget-content widget-content-area">                                
                                    <form method="POST" action="" class="needs-validation" novalidate>
                                        {% csrf_token %}
                                        <div class="form-row">
                                            <div class="col-md-12 mb-12">

                                                <label for="validationCustom01">Subject</label>
                                                {{form.subject}}
                                                
                                            </div>
                                        </div>
                                    </br>
                                        <div class="form-row">
                                            <div class="col-md-12 mb-12">

                                                <label for="validationCustom01">Message</label>
                                                {{form.message}}
                                            </div>
                                        </div>
                                        
                                        
                                        <button class="btn btn-primary mt-3" type="submit">Send Message</button>
                                    </form>
                                    
                                </div>
                            </div>
                        </div>
                    </div>







                </div>
            </div>
        </div>
        <!--  END CONTENT AREA  -->
    </div>
    <!-- END MAIN CONTAINER -->
{% endblock content %}
